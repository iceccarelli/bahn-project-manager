name: CI/CD — Perfect Integration Pipeline

on:
  push:
    branches: [main, upgrade/*]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      # Data integrity: canonical Bahnhofsmanagement, station master invariants,
      # derived blocks in sync, and no regression in map coverage.
      - run: pnpm verify:data

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:cov
      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:parallel
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy-preview:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Check Vercel credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN not set — skipping Action deploy. Vercel's Git integration handles preview deploys."
          fi
      - name: Deploy preview to Vercel
        if: steps.creds.outputs.ok == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--preview'

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Check Vercel credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN not set — skipping Action deploy. Vercel's Git integration handles production deploys."
          fi
      - name: Deploy production to Vercel
        if: steps.creds.outputs.ok == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

  # ---------------------------------------------------------------------------
  # End-to-end smoke suite. Runs the production bundle in headless Chromium and
  # asserts the flows that carry data: navigation, an edit surviving a reload
  # and reaching the audit trail, filtering, sorting, and the wizard producing a
  # real PDF with the corrected ITK recipients.
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Only Chromium, and only its own deps — the full `playwright install`
      # pulls three browsers this suite never opens.
      - run: pnpm exec playwright install --with-deps chromium
      - run: NODE_ENV=production pnpm build:client
      - run: pnpm e2e
      # Layout gates run on the same build and the same browser install.
      # check:responsive asserts no route overflows its viewport at seven
      # widths and that navigation is reachable at each — the assertion that
      # catches the header trigger and MOBILE_BREAKPOINT drifting apart.
      # check:map asserts the map's own chrome never overlaps, spills or drops
      # below 44px on a touch pointer, in both legend states.
      - run: pnpm check:responsive
      - run: pnpm check:map
      # check:ui asserts the shared tone palette actually reaches the built
      # stylesheet, and that no text spills its container, is painted over
      # another string, falls below its WCAG contrast floor, or renders at a
      # size outside the type scale — across six routes, four interactive
      # surfaces and three viewports.
      - run: pnpm check:ui

  # ---------------------------------------------------------------------------
  # Containerisation gate. Builds the production image and proves the container
  # actually comes up and answers its own health route — a Dockerfile that
  # builds but produces a container that never becomes healthy is a deploy
  # outage, not a build success.
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: bahn-project-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and reports healthy
        run: |
          docker run -d --name bpm -p 3000:3000 bahn-project-manager:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then
              echo; echo "container healthy"; docker rm -f bpm; exit 0
            fi
            sleep 2
          done
          echo "health check never passed"; docker logs bpm; exit 1
