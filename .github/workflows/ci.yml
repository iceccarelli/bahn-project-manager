name: CI — container topology is the production path (Vercel is a static demo only)

on:
  push:
    branches: [main, upgrade/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      # Data integrity: canonical Bahnhofsmanagement, station master invariants,
      # derived blocks in sync, and no regression in map coverage.
      - run: pnpm verify:data
      # The state of this checkout in one picture: tools, data, where changes
      # are written, foreign bindings, stray transfer patches — and the
      # container manifest. The last one exists because the docker job failed
      # for months on a patchedDependency the Dockerfile never copied, and a
      # 19-second red X nobody reads is not a gate.
      - run: node scripts/doctor.mjs
      # The repository is public: no real project/schedule/contact data, no operator addresses (docs/data-governance.md).
      - run: node scripts/data/check-no-private-data.mjs

  test:
    runs-on: ubuntu-latest
    # Real MySQL + Redis: the transaction/outbox/realtime suites are only worth
    # anything against the real engines (they skip visibly when these are absent).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s
          --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:cov
      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # PRODUCTION artifact: VITE_SERVER_MODE=1 is pinned by the script, the build refuses anything else, and the
      # emitted build-info.json is asserted (a production build containing SERVER_MODE=false fails here).
      - run: pnpm build:production
      - run: node scripts/assert-build-target.mjs dist/public production
      # The guard itself must fail when it should: a demo build is NOT a production artifact...
      - name: Guard rejects a demo build as production
        run: |
          ! BUILD_TARGET=production VITE_SERVER_MODE=0 pnpm exec vite build --outDir "$RUNNER_TEMP/wrong" 2>&1
          pnpm build:demo
          ! node scripts/assert-build-target.mjs dist/public production
      # The bundle is the artefact the container runs, so the checks that are
      # about the bundle belong here: no devDependency may appear in the server
      # entry. That import is what killed the container on its first line.
      - run: node scripts/doctor.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy-preview:
    # static demo preview only (see deploy-vercel-demo)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Check Vercel credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN not set — skipping Action deploy. Vercel's Git integration handles preview deploys."
          fi
      - name: Deploy preview to Vercel
        if: steps.creds.outputs.ok == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--preview'

  # NOT production. The Vercel project serves the static, browser-local demo build (no backend, demo login). The
  # production system is the container stack (docs/topology.md); nothing here deploys it or represents it.
  deploy-vercel-demo:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Check Vercel credentials
        id: creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::VERCEL_TOKEN not set — demo deploy skipped."; fi
      - name: Deploy the static demo to Vercel
        if: steps.creds.outputs.ok == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

  # ---------------------------------------------------------------------------
  # End-to-end smoke suite. Runs the production bundle in headless Chromium and
  # asserts the flows that carry data: navigation, an edit surviving a reload
  # and reaching the audit trail, filtering, sorting, and the wizard producing a
  # real PDF with the corrected ITK recipients.
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    # smoke + responsive + map + check:ui (3 viewports x 2 themes x ~20 surfaces) measured ~16 min on a runner: 15 cancelled it
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Only Chromium, and only its own deps — the full `playwright install`
      # pulls three browsers this suite never opens.
      - run: pnpm exec playwright install --with-deps chromium
      # The browser-local DEMO artifact — deliberately not the production build.
      - run: pnpm build:demo
      - run: pnpm e2e
      # Layout gates run on the same build and the same browser install.
      # check:responsive asserts no route overflows its viewport at seven
      # widths and that navigation is reachable at each — the assertion that
      # catches the header trigger and MOBILE_BREAKPOINT drifting apart.
      # check:map asserts the map's own chrome never overlaps, spills or drops
      # below 44px on a touch pointer, in both legend states.
      - run: pnpm check:responsive
      - run: pnpm check:map
      # check:ui asserts the shared tone palette actually reaches the built
      # stylesheet, and that no text spills its container, is painted over
      # another string, falls below its WCAG contrast floor, or renders at a
      # size outside the type scale — across six routes, four interactive
      # surfaces and three viewports.
      - run: pnpm check:ui

  # ---------------------------------------------------------------------------
  # Container gate. Builds the PRODUCTION image and runs it against real MySQL 8.4 + Redis 7 with the
  # configuration production requires (CI-only values; the image's own validation is NOT weakened — the script
  # first asserts the image still refuses to boot without it). Proves: boot, /api/health, /api/ready (DB + Redis),
  # migrations (twice), that the image ships the production server-mode client, and graceful SIGTERM shutdown.
  # ---------------------------------------------------------------------------
  container:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: bahn_ci }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: bahn-project-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container gate (boot, health, ready, migrations, DB, Redis, shutdown)
        run: scripts/gate/container-ci.sh
        env:
          IMAGE: bahn-project-manager:ci
          CI_DATABASE_URL: mysql://root:root@127.0.0.1:3306/bahn_ci
          CI_REDIS_URL: redis://127.0.0.1:6379

  # ---------------------------------------------------------------------------
  # Server-mode browser proofs against REAL MySQL 8.4 + Redis 7: two browsers, two server instances (realtime,
  # conflict, workspace move, recovery, presence, notifications, topology) and the real sign-in flow (mock IdP).
  # ---------------------------------------------------------------------------
  e2e-server:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      E2E_DB_BASE: mysql://root:root@127.0.0.1:3306
      E2E_REDIS: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: scripts/e2e/build-server-mode.sh
      - run: pnpm exec tsx scripts/e2e/server-mode.e2e.ts
      - run: OUT=dist-oidc VITE_OIDC_AUTHORITY=http://127.0.0.1:3290/ VITE_OIDC_CLIENT_ID=bahn-spa VITE_OIDC_SCOPE='openid profile' scripts/e2e/build-server-mode.sh
      - run: OUT=dist-oidc pnpm exec tsx scripts/e2e/oidc-browser.e2e.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-server-artifacts, path: artifacts/ }

  # ---------------------------------------------------------------------------
  # UI performance regression gate: the production client against the real server, MySQL 8.4 and the 1,298-row dataset,
  # measured in headless Chromium (DOM size, rows in DOM, heap, scroll frames, INP, LCP, CLS, first map marker) and
  # compared with scripts/perf/thresholds.json. The virtualized table must not regress to rendering every loaded row.
  # ---------------------------------------------------------------------------
  ui-perf:
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: bahn_perf }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: scripts/e2e/build-server-mode.sh
      - run: DATABASE_URL=mysql://root:root@127.0.0.1:3306/bahn_perf node dist-e2e/migrate.js
      - run: pnpm exec tsx scripts/e2e/seed-real.ts mysql://root:root@127.0.0.1:3306/bahn_perf
      - run: pnpm exec tsx scripts/perf/browser-perf.ts --label ci
        env:
          PERF_DATABASE_URL: mysql://root:root@127.0.0.1:3306/bahn_perf
          E2E_REDIS: redis://127.0.0.1:6379
      - run: node scripts/perf/check-thresholds.mjs artifacts/browser-perf-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-perf, path: artifacts/ }

  # Migrations on the intended production engine, twice (idempotent), with the structure the app relies on.
  migrations-mysql84:
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: bahn }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:server
      - run: DATABASE_URL=mysql://root:root@127.0.0.1:3306/bahn node dist/migrate.js
      - run: DATABASE_URL=mysql://root:root@127.0.0.1:3306/bahn node dist/migrate.js
      - name: FULLTEXT index and audit triggers exist
        run: |
          docker run --rm --network host mysql:8.4 mysql -h127.0.0.1 -uroot -proot bahn -e "SELECT COUNT(*) AS ft FROM information_schema.statistics WHERE table_schema='bahn' AND index_name='projects_search_ft' AND index_type='FULLTEXT'; SELECT COUNT(*) AS triggers FROM information_schema.triggers WHERE trigger_schema='bahn';" | tee /dev/stderr | grep -E "^(4|2)$" | wc -l | grep -q 2

  # PRODUCTION IMAGE (server-mode client, OIDC build args). Built for every push; PUBLISHED from main only. The
  # image — not Vercel — is the unit that is deployed (deploy/staging/docker-compose.yml → docs/topology.md).
  image:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test, e2e-server, migrations-mysql84, container]
    permissions: { contents: read, packages: write }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ github.ref == 'refs/heads/main' }}
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            VITE_OIDC_AUTHORITY=${{ vars.VITE_OIDC_AUTHORITY }}
            VITE_OIDC_CLIENT_ID=${{ vars.VITE_OIDC_CLIENT_ID }}
            VITE_OIDC_SCOPE=${{ vars.VITE_OIDC_SCOPE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # THE DEPLOYMENT GATE. All-or-nothing: red unless every check passed, including a smoke run against a real HTTPS
  # staging URL with real tokens and a load certification from a separate host. Manual: it is evidence, not a build step.
  # ---------------------------------------------------------------------------
  deployment-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306
      TEST_REDIS_URL: redis://127.0.0.1:6379
      E2E_DB_BASE: mysql://root:root@127.0.0.1:3306
      SIM_DATABASE_URL: mysql://root:root@127.0.0.1:3306/bahn_sim
      STAGING_URL: ${{ vars.STAGING_URL }}
      SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
      SMOKE_TOKEN_RESTRICTED: ${{ secrets.SMOKE_TOKEN_RESTRICTED }}
      SMOKE_TOKEN_NOCLAIM: ${{ secrets.SMOKE_TOKEN_NOCLAIM }}
      SMOKE_WORKSPACE: ${{ vars.SMOKE_WORKSPACE }}
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/gate/deploy-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: deployment-gate, path: artifacts/ }
